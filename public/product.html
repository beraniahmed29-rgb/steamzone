<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamZone</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon2.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="product.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-icon"><i class="fa-brands fa-steam"></i></span>
        <span class="logo-text">Steam<span>Zone</span></span>
      </a>
      <nav class="nav" id="nav">
        <a href="/#accounts">الحسابات</a>
      </nav>
      <div class="header-actions">
        <a href="/#accounts" class="btn btn-primary btn-sm"><i class="fa-solid fa-store"></i> المتجر</a>
      </div>
    </div>
  </header>

  <div class="container product-page" id="product-page">
    <div class="product-loading"><span class="spinner spinner-lg"></span></div>
  </div>

  <footer class="footer" style="margin-top:60px">
    <div class="container footer-bottom">© 2026 SteamZone — جميع الحقوق محفوظة.</div>
  </footer>

  <script src="data.js"></script>
  <script src="product.js"></script>
</body>
</html>
