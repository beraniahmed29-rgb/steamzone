<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamZone</title>
  <link rel="icon" type="image/svg+xml" href="favicon2.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view" class="login-view">
    <div class="login-box">
      <div class="login-logo"><i class="fa-brands fa-steam"></i></div>
      <h2>لوحة تحكم <span>SteamZone</span></h2>
      <p>إدارة الطلبات والتواصل مع العملاء عبر Discord</p>
      <form id="login-form">
        <input type="text" id="login-user" placeholder="اسم المستخدم" required>
        <input type="password" id="login-pass" placeholder="كلمة المرور" required>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span class="btn-label">تسجيل الدخول</span>
          <span class="spinner" style="display:none"></span>
        </button>
      </form>
      <a href="/" class="back-link"><i class="fa-solid fa-arrow-right"></i> العودة للمتجر</a>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-view" class="dash-view" style="display:none">
    <header class="dash-header">
      <div class="container dash-header-inner">
        <div class="dash-brand"><i class="fa-brands fa-steam"></i> Steam<span>Zone</span> <em>Admin</em></div>
        <div class="dash-actions">
          <button class="icon-btn" onclick="loadOrders()" title="تحديث"><i class="fa-solid fa-rotate"></i></button>
          <a href="/" class="icon-btn" title="المتجر"><i class="fa-solid fa-store"></i></a>
          <button class="icon-btn" onclick="logout()" title="خروج"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="stats-grid" id="stats-grid"></div>

      <div class="panel">
        <div class="panel-head">
          <h3><i class="fa-solid fa-list-check"></i> الطلبات</h3>
          <div class="panel-tools">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="q" placeholder="بحث بالمرجع، الاسم، الهاتف، رقم العملية..." oninput="debouncedLoad()">
            </div>
            <select id="status-filter" onchange="loadOrders()">
              <option value="all">كل الحالات</option>
              <option value="pending">جديد</option>
              <option value="contacted">تم التواصل</option>
              <option value="completed">مكتمل</option>
              <option value="cancelled">ملغى</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="orders-table" id="orders-table">
            <thead>
              <tr>
                <th>المرجع</th>
                <th>العميل</th>
                <th>Discord</th>
                <th>الطلبات</th>
                <th>الحالة</th>
                <th>التاريخ</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
          <p class="empty-state" id="orders-empty" style="display:none">لا توجد طلبات مطابقة.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ORDER DETAILS MODAL -->
  <div class="modal" id="order-modal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="admin.js"></script>
</body>
</html>
